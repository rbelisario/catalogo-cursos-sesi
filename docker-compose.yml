
services:
  postgres:
    image: postgres:17
    container_name: catalogo-cursos-sesi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_cursos
      POSTGRES_USER: catalogo_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo_app -d catalogo_cursos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
